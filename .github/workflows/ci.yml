name: CI

# Merge gate for the BHB ERP. Typecheck and lint are both currently clean,
# so any new error here is a genuine regression introduced by the change —
# not pre-existing debt. Keep it that way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile — never silently resolves
      # a different tree than the one that was reviewed.
      #
      # The lockfile is generated on macOS, so npm prunes every non-darwin
      # platform binary from it (npm/cli#4828) — on a Linux runner Tailwind v4
      # then dies with "Cannot find module '../lightningcss.linux-x64-gnu.node'".
      # Install the Linux binaries explicitly, at the same pinned versions
      # apps/web/Dockerfile uses, so CI builds the same tree production does.
      - name: Install
        run: |
          npm ci
          npm install --no-save --workspace=web \
            lightningcss-linux-x64-gnu@1.32.0 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.2

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Self-test harnesses (no test framework in this repo by design —
      # these run as plain tsx scripts and exit non-zero on failure).
      - name: Test — session cookie cannot be forged
        working-directory: apps/web
        run: npm run test:session-cookie

      - name: Test — a client cannot replace the masters id generation
        working-directory: apps/web
        run: npm run test:masters-write-guard

      - name: Test — a stale masters push cannot overwrite a newer save
        working-directory: apps/web
        run: npm run test:masters-revision-guard

      - name: Test — a refused client can recover and save again
        working-directory: apps/web
        run: npm run test:masters-revision-lifecycle

      - name: Test — a cold client does not invent a school
        working-directory: apps/web
        run: npm run test:masters-cold-client

      - name: Test — a stale wipe signal expires
        working-directory: apps/web
        run: npm run test:tenant-wipe-expiry

      - name: Test — a failed read cannot be mistaken for empty data
        working-directory: apps/web
        run: npm run test:data-contract

      - name: Test — failed reads never look like empty data
        working-directory: apps/web
        run: npm run test:hydrate-failure-safety

      - name: Test — optimistic-locking token survives normalization
        working-directory: apps/web
        run: npm run test:sis-revision

      - name: Test — a partial sync can never wipe the roster
        working-directory: apps/web
        run: npm run test:sis-prune

      - name: Test — a removed student is actually deleted
        working-directory: apps/web
        run: npm run test:sis-delete

      - name: Test — an empty desk never refuses the server's masters
        working-directory: apps/web
        run: npm run test:masters-freeze

      - name: Test — a guessed academic year never reaches the server session
        working-directory: apps/web
        run: npm run test:session-year

      - name: Test — a failed masters read is never guarded as empty
        working-directory: apps/web
        run: npm run test:masters-read-failure

      - name: Test — a full localStorage never blocks the database write
        working-directory: apps/web
        run: npm run test:save-full-cache

      - name: Test — an ended academic year cannot still be current
        working-directory: apps/web
        run: npm run test:academic-year-resolve

      - name: Test — a list projection never breaks pagination
        working-directory: apps/web
        run: npm run test:projection

      - name: Test — an image is never stored inside a lead row
        working-directory: apps/web
        run: npm run test:survey-photo

      - name: Test — a failed read is never shaped like data
        working-directory: apps/web
        run: npm run test:read-client

      - name: Test — a failing guard refuses the push, never falls back silently
        working-directory: apps/web
        run: npm run test:sis-guard-fallback

      - name: Test — audit trail never stores identity numbers
        working-directory: apps/web
        run: npm run test:audit-redaction

      - name: Test — roster filters persist and share correctly
        working-directory: apps/web
        run: npm run test:student-filters

      - name: Test — server masters come from desk without wiping staff
        working-directory: apps/web
        run: npm run test:masters-merge

      - name: Test — the accounts books balance
        working-directory: apps/web
        run: npm run test:accounts

      - name: Test — fee structure / import / automation suites
        working-directory: apps/web
        run: |
          npm run test:playbook
          npm run test:erp-chat
          npm run test:wa-templates-automation

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same Linux-binary install as the verify job and apps/web/Dockerfile —
      # the macOS-generated lockfile carries no linux-x64-gnu binaries.
      - name: Install
        run: |
          npm ci
          npm install --no-save --workspace=web \
            lightningcss-linux-x64-gnu@1.32.0 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.2

      # Catches anything that only fails at build time (bad dynamic
      # imports, server/client boundary violations) before it reaches
      # Cloud Run. Placeholder env values: the build must not require
      # real secrets, and if it starts to, that itself is worth knowing.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
