<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BHB UDISE Robot</title>
  <style>
    body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b2a3a; margin: 14px; min-width: 300px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; border: 1px solid #c9d3de; border-radius: 6px; }
    button { margin-top: 10px; padding: 6px 12px; border: 0; border-radius: 6px; background: #0f4c81; color: #fff; font-weight: 600; cursor: pointer; }
    .muted { color: #5f6f80; font-size: 12px; }
    #who, #saved { margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🤖 BHB UDISE Robot</h1>
  <p class="muted">Open the UDISE+ Student module and log in; the robot's panel appears at the bottom right. It acts only when you click.</p>
  <label for="erp">ERP address</label>
  <input id="erp" type="url" placeholder="https://bhbinternational.school" />
  <button id="save" type="button">Save</button>
  <div id="saved" class="muted"></div>
  <div id="who" class="muted">Checking your ERP login…</div>
  <script src="options.js"></script>
</body>
</html>
