name: cbse_school_mobile
description: BHB International School ERP — staff & parent mobile app.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.9.1
  geolocator: ^14.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-crest.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F6F5EF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
