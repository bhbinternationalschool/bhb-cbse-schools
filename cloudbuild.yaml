# Deploy CBSE Schools (this repo) to Cloud Run service school-erp-web
# Region/repo match existing bhbinternational.school production.

substitutions:
  _REGION: asia-southeast1
  _REPO: bhb-school-erp-repo
  _SERVICE: school-erp-web
  # Override at submit time from scripts/deploy-online.sh (do not commit secrets)
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_APP_URL: https://bhbinternational.school
  _NEXT_PUBLIC_DEMO_AUTH: "true"
  # Server-only runtime (from apps/web/.env.local via deploy-online.sh)
  _SUPABASE_SERVICE_ROLE_KEY: ""
  _WHATSAPP_TOKEN: ""
  _WHATSAPP_PHONE_ID: ""
  _WHATSAPP_VERIFY_TOKEN: ""
  _WHATSAPP_WABA_ID: ""
  _WHATSAPP_DEFAULT_COUNTRY_CODE: "91"
  _WHATSAPP_GRAPH_VERSION: "v21.0"
  _GOOGLE_MAPS_API_KEY: ""
  _GEMINI_API_KEY: ""
  _OPENAI_API_KEY: ""
  _AI_TUTOR_MODEL: "gpt-4o-mini"
  _AI_PREFERRED_ENGINE: "auto"
  _GOOGLE_OAUTH_CLIENT_ID: ""
  _GOOGLE_OAUTH_CLIENT_SECRET: ""
  _CRON_SECRET: ""
  _WA_DISPATCH_SECRET: ""
  _MIRROR_SYNC_SECRET: ""
  _PROTECTED_SUPER_ADMIN_EMAILS: "director@bhbinternational.school,ashishsingh80@gmail.com,ashu.dube21@gmail.com"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_DEMO_AUTH=${_NEXT_PUBLIC_DEMO_AUTH}
      - --build-arg
      - NEXT_PUBLIC_SCHOOL_NAME=BHB International School
      - --build-arg
      - NEXT_PUBLIC_TENANT_SLUG=bhb-international
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=^|^NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}|NEXT_PUBLIC_DEMO_AUTH=${_NEXT_PUBLIC_DEMO_AUTH}|NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}|NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}|NEXT_PUBLIC_SCHOOL_NAME=BHB International School|NEXT_PUBLIC_TENANT_SLUG=bhb-international|NODE_ENV=production|SUPABASE_SERVICE_ROLE_KEY=${_SUPABASE_SERVICE_ROLE_KEY}|CRON_SECRET=${_CRON_SECRET}|WA_DISPATCH_SECRET=${_WA_DISPATCH_SECRET}|MIRROR_SYNC_SECRET=${_MIRROR_SYNC_SECRET}|WHATSAPP_TOKEN=${_WHATSAPP_TOKEN}|WHATSAPP_PHONE_ID=${_WHATSAPP_PHONE_ID}|WHATSAPP_VERIFY_TOKEN=${_WHATSAPP_VERIFY_TOKEN}|WHATSAPP_WABA_ID=${_WHATSAPP_WABA_ID}|WHATSAPP_DEFAULT_COUNTRY_CODE=${_WHATSAPP_DEFAULT_COUNTRY_CODE}|WHATSAPP_GRAPH_VERSION=${_WHATSAPP_GRAPH_VERSION}|GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}|GEMINI_API_KEY=${_GEMINI_API_KEY}|OPENAI_API_KEY=${_OPENAI_API_KEY}|AI_TUTOR_MODEL=${_AI_TUTOR_MODEL}|AI_PREFERRED_ENGINE=${_AI_PREFERRED_ENGINE}|GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}|GOOGLE_OAUTH_CLIENT_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET}|PROTECTED_SUPER_ADMIN_EMAILS=${_PROTECTED_SUPER_ADMIN_EMAILS}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
