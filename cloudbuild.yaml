# Deploy CBSE Schools (this repo) to Cloud Run service school-erp-web
# Region/repo match existing bhbinternational.school production.

substitutions:
  _REGION: asia-southeast1
  _REPO: bhb-school-erp-repo
  _SERVICE: school-erp-web
  # Override at submit time from scripts/deploy-online.sh (do not commit secrets)
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_APP_URL: https://bhbinternational.school
  _NEXT_PUBLIC_DEMO_AUTH: "true"
  # Server-only runtime (from apps/web/.env.local via deploy-online.sh)
  #
  # SUPABASE_SERVICE_ROLE_KEY, WHATSAPP_TOKEN, WHATSAPP_VERIFY_TOKEN,
  # GOOGLE_MAPS_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY,
  # GOOGLE_OAUTH_CLIENT_SECRET, CRON_SECRET, WA_DISPATCH_SECRET, and
  # MIRROR_SYNC_SECRET moved to Secret Manager on 2026-08-12 (see the
  # --set-secrets line in the deploy step) and are declared there directly —
  # no longer substitution values, so they are NOT declared here. Cloud Build
  # rejects any --substitutions key that isn't referenced somewhere in this
  # file, so if deploy-online.sh is ever changed to pass one of these ten
  # again, the build will fail with "not matched in the template" rather
  # than silently reintroducing the plaintext-credential leak this replaced.
  _WHATSAPP_PHONE_ID: ""
  _WHATSAPP_WABA_ID: ""
  _WHATSAPP_DEFAULT_COUNTRY_CODE: "91"
  _WHATSAPP_GRAPH_VERSION: "v21.0"
  _AI_TUTOR_MODEL: "gpt-4o-mini"
  # Gemini primary since 2026-08-18 (cheaper, same GCP project, better Indic
  # text); OpenAI stays as automatic fallback. Every deploy re-applies this
  # value, so changing it on the service alone is undone by the next build.
  _AI_PREFERRED_ENGINE: "gemini"
  _GOOGLE_OAUTH_CLIENT_ID: ""
  _PROTECTED_SUPER_ADMIN_EMAILS: "director@bhbinternational.school,ashishsingh80@gmail.com,ashu.dube21@gmail.com"
  # VAPID public key — not secret (it's meant to ship in the client bundle),
  # so it's a substitution like NEXT_PUBLIC_SUPABASE_URL, not Secret Manager.
  # The matching private key IS secret — see VAPID_PRIVATE_KEY below.
  _NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
  # Tata Fleet Edge webhook config — not secret (an IP allowlist and a
  # notify phone number, not credentials), same substitution treatment as
  # PROTECTED_SUPER_ADMIN_EMAILS above.
  _FLEET_EDGE_ALLOWED_IPS: ""
  _FLEET_EDGE_SOS_NOTIFY_MOBILE: ""
  # Cashfree PG (2026-08-27). The mode flag is baked into the client bundle
  # (build-arg) AND set at runtime — a runtime-only NEXT_PUBLIC var is inert
  # in the browser. App ID is the public client id (not secret); the secret
  # key lives in Secret Manager — see CASHFREE_SECRET_KEY in --set-secrets.
  _NEXT_PUBLIC_PAYMENT_GATEWAY: ""
  _CASHFREE_APP_ID: ""
  _CASHFREE_ENV: "production"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_DEMO_AUTH=${_NEXT_PUBLIC_DEMO_AUTH}
      - --build-arg
      - NEXT_PUBLIC_SCHOOL_NAME=BHB International School
      - --build-arg
      - NEXT_PUBLIC_TENANT_SLUG=bhb-international
      - --build-arg
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - --build-arg
      - NEXT_PUBLIC_PAYMENT_GATEWAY=${_NEXT_PUBLIC_PAYMENT_GATEWAY}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=2Gi
      - --cpu=2
      # 0, not 1. A warm 2 vCPU / 2 GiB instance billed around the clock was
      # the largest single line on the GCP bill, for a school ERP used in
      # office hours. The trade is a few seconds of cold start on the first
      # request after an idle spell.
      #
      # This lives here rather than being set with `gcloud run services
      # update`, because every deploy re-applies these flags — a value set only
      # on the service is one deploy away from silently reverting. That is
      # exactly what happened on 2026-08-22: min-instances was set to 0, and
      # the next deploy put it straight back to 1.
      - --min-instances=0
      - --max-instances=20
      # SUPABASE_SERVICE_ROLE_KEY, CRON_SECRET, WA_DISPATCH_SECRET,
      # MIRROR_SYNC_SECRET, WHATSAPP_TOKEN, WHATSAPP_VERIFY_TOKEN,
      # GOOGLE_MAPS_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, and
      # GOOGLE_OAUTH_CLIENT_SECRET moved to Secret Manager on 2026-08-12 (the
      # plain value was readable via `gcloud run services describe`). This
      # step used to push all ten back as literal strings on every deploy,
      # which Cloud Run refuses once a var is secret-backed — "Cannot update
      # environment variable [...] because it has already been set with a
      # different type." They now go through --set-secrets below instead.
      - --set-env-vars=^|^NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}|NEXT_PUBLIC_DEMO_AUTH=${_NEXT_PUBLIC_DEMO_AUTH}|NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}|NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}|NEXT_PUBLIC_SCHOOL_NAME=BHB International School|NEXT_PUBLIC_TENANT_SLUG=bhb-international|NODE_ENV=production|WHATSAPP_PHONE_ID=${_WHATSAPP_PHONE_ID}|WHATSAPP_WABA_ID=${_WHATSAPP_WABA_ID}|WHATSAPP_DEFAULT_COUNTRY_CODE=${_WHATSAPP_DEFAULT_COUNTRY_CODE}|WHATSAPP_GRAPH_VERSION=${_WHATSAPP_GRAPH_VERSION}|AI_TUTOR_MODEL=${_AI_TUTOR_MODEL}|AI_PREFERRED_ENGINE=${_AI_PREFERRED_ENGINE}|GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}|PROTECTED_SUPER_ADMIN_EMAILS=${_PROTECTED_SUPER_ADMIN_EMAILS}|NEXT_PUBLIC_VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}|VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}|FLEET_EDGE_ALLOWED_IPS=${_FLEET_EDGE_ALLOWED_IPS}|FLEET_EDGE_SOS_NOTIFY_MOBILE=${_FLEET_EDGE_SOS_NOTIFY_MOBILE}|NEXT_PUBLIC_PAYMENT_GATEWAY=${_NEXT_PUBLIC_PAYMENT_GATEWAY}|CASHFREE_APP_ID=${_CASHFREE_APP_ID}|CASHFREE_ENV=${_CASHFREE_ENV}
      - --set-secrets=^|^SUPABASE_SERVICE_ROLE_KEY=school-erp-supabase-service-role-key:latest|CRON_SECRET=school-erp-cron-secret:latest|WA_DISPATCH_SECRET=school-erp-wa-dispatch-secret:latest|MIRROR_SYNC_SECRET=school-erp-mirror-sync-secret:latest|WHATSAPP_TOKEN=school-erp-whatsapp-token:latest|WHATSAPP_VERIFY_TOKEN=school-erp-whatsapp-verify-token:latest|GOOGLE_MAPS_API_KEY=school-erp-google-maps-api-key:latest|GEMINI_API_KEY=school-erp-gemini-api-key:latest|OPENAI_API_KEY=school-erp-openai-api-key:latest|GOOGLE_OAUTH_CLIENT_SECRET=school-erp-google-oauth-client-secret:latest|DIRECT_URL=school-erp-direct-url:latest|VAPID_PRIVATE_KEY=school-erp-vapid-private-key:latest|WA_APP_SECRET=school-erp-wa-app-secret:latest|SARVAM_API_KEY=school-erp-sarvam-api-key:latest|GMAIL_SA_KEY_JSON=school-erp-gmail-sa-key:latest|CASHFREE_SECRET_KEY=school-erp-cashfree-secret-key:latest|GOOGLE_CALENDAR_API_KEY=school-erp-google-calendar-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
